name: Throwaway if proof

# Throwaway: reproduces the job graph of ci.yml (a skipped ancestor, a parent that
# runs through !cancelled(), a child) to observe which condition runs the child.
# Deleted before the pull request is merged.
on:
  push:
    branches: [ci-release-after-deploy]

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.p.outputs.mode }}
    steps:
      - id: p
        run: echo "mode=skip" >> "$GITHUB_OUTPUT"

  ci:
    needs: plan
    if: ${{ needs.plan.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never

  deploy:
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never

  release:
    needs: [plan, deploy]
    if: >-
      ${{ !cancelled() && (needs.deploy.result == 'success'
      || (github.event_name == 'push' && needs.plan.outputs.mode == 'skip')) }}
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.r.outputs.created }}
    steps:
      - id: r
        run: echo "created=true" >> "$GITHUB_OUTPUT"

  # The condition ci.yml had: implicit success()
  implicit:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo implicit ran

  # The condition ci.yml has now
  explicit:
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result == 'success'
      && needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo explicit ran

  # And when the release job did not create anything: must not run
  explicit-negative:
    needs: release
    if: >-
      ${{ !cancelled() && needs.release.result == 'success'
      && needs.release.outputs.created == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
