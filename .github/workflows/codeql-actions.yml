name: "CodeQL Actions"

# The analysis of the workflows themselves (.github/). Nothing else feeds it,
# so it runs when .github/ changes, and weekly in case CodeQL's queries did.
# The TypeScript has its own workflow (codeql-analysis.yml), which skips
# Markdown-only changes.
on:
  push:
    branches: ["master"]
    paths:
      - ".github/**"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/**"
  schedule:
    - cron: "21 13 * * 5"
  # Allow manually re-running the analysis from the Actions tab
  workflow_dispatch:

# A new push to a pull request makes its running analysis obsolete: cancel it.
# Every other run has a group of its own (the commit), so a push to master is
# never cancelled and no scan is dropped from the queue.
concurrency:
  group: codeql-actions-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    # Public repository, no private query packs: uploading results is all
    # it needs beyond reading the code.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"
