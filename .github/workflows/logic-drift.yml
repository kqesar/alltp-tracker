name: Logic drift

# Once a week, and on demand, compare the head of each randomizer's default
# branch with the commit its pack's upstream.json pins (packs/alttpr,
# packs/smz3). When a file it lists changed, or ALttPR's LOGIC moved, open or
# update that pack's open issue labelled logic-drift; the logic-drift skill
# (.claude/skills/logic-drift) ports ALttPR's change from there, the pack's
# README SMZ3's. Nothing changed: nothing happens.
# Upstream is read through the GitHub API only: this workflow checks out
# none of it and runs none of its code. packs/alttpr/scripts/logic-drift.mjs
# holds the logic, with its tests.
on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Two runs at once could both open the issue
concurrency:
  group: logic-drift
  cancel-in-progress: false

jobs:
  logic-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The manifest and the script that reads it, nothing else
      - name: Checkout the manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packs/alttpr/upstream.json
            packs/alttpr/scripts/logic-drift.mjs
            packs/smz3/upstream.json
          sparse-checkout-cone-mode: false

      - name: Compare upstream with the pinned commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkDrift } = await import(
              `${process.env.GITHUB_WORKSPACE}/packs/alttpr/scripts/logic-drift.mjs`
            );
            await checkDrift({ context, core, github });
            await checkDrift({
              context,
              core,
              github,
              manifestPath: `${process.env.GITHUB_WORKSPACE}/packs/smz3/upstream.json`,
              pack: "smz3",
            });
