name: Validate Conventional Commits

on:
  pull_request:
    branches:
      - master

# Least-privilege default: this workflow only needs to read the repository
permissions:
  contents: read

jobs:
  validate-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pnpm, the Node.js package.json pins (devEngines.runtime), then the
      # dependencies as the lockfile has them, from a cached store
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      # Run the commitlint pinned in package.json, the one the husky hook runs.
      # A third-party action bundles its own older copy, which rejected every
      # Dependabot body: newer commitlint skips long lines that hold a URL.
      - name: Validate commit messages
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
