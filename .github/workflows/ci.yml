name: CI

on:
  # "*" stops at a slash, so it never matched feat/… or dependabot/… branches:
  # run on every pull request, whatever its branch, and on master once merged.
  push:
    branches: [master]
    # No job reads Markdown: a docs-only change has nothing to test or deploy
    paths-ignore: &docs-only
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore: *docs-only
  # Run from the Actions tab on master to redeploy the site
  workflow_dispatch:

# A new push to a pull request makes its running checks obsolete: cancel them.
# Pushes to master always run to the end, so deployments never overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The coverage comment on pull requests
  pull-requests: write

jobs:
  # A push to master that only releases (release-please's commit: version and
  # changelog) changes nothing the tests or the site can see: the jobs below
  # skip it. Pull requests have no plan, and without one everything runs.
  plan:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/plan.yml

  ci:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.release != 'true' }}
    runs-on: ubuntu-latest
    # `actions: read` lets the store check below list the repository's caches
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm store is saved by this job, on master, once per lockfile: every
      # other job in the repository only restores it (docs/ci.md, "Caches").
      # pnpm/setup would otherwise save a new copy (about 120 MB, under a key
      # unique to the run) at the end of every job, and the copies pushed the
      # Rust caches towards eviction. A pull request reads master's copy.
      # If the listing fails, `save` stays true: a spare copy beats none.
      - name: Is the pnpm store already cached for this lockfile?
        id: store
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
        run: |
          keys=$(gh cache list --ref refs/heads/master --key pnpm-cache-Linux --limit 100 \
            --json key --jq '.[].key') || keys=""
          if grep -q -- "-${LOCKFILE_HASH}-" <<< "$keys"; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "A store for this lockfile is cached already."
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
            echo "No store for this lockfile yet: this job saves it."
          fi

      # pnpm, the Node.js package.json pins (devEngines.runtime), then the
      # dependencies as the lockfile has them, from a cached store
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: ${{ steps.store.outputs.save == 'true' }}
          require-lockfile: true

      - name: Run linter
        id: lint
        run: pnpm lint

      # Every workspace: the web app, its config files and e2e suite, the
      # engine and the game packs
      - name: Type-check
        id: typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        id: test
        run: pnpm test:coverage

      - name: Generate coverage summary
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage file found, processing..."
            # Extract coverage data using node
            node -e "
              const fs = require('fs');
              try {
                const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
                const total = coverage.total;
                console.log('COVERAGE_LINES=' + total.lines.pct);
                console.log('COVERAGE_STATEMENTS=' + total.statements.pct);
                console.log('COVERAGE_FUNCTIONS=' + total.functions.pct);
                console.log('COVERAGE_BRANCHES=' + total.branches.pct);
                console.log('COVERAGE_AVAILABLE=true');
              } catch (e) {
                console.log('COVERAGE_AVAILABLE=false');
                console.log('Error reading coverage:', e.message);
              }
            " >> $GITHUB_ENV
          else
            echo "COVERAGE_AVAILABLE=false" >> $GITHUB_ENV
            echo "Coverage file not found"
          fi

      # After a failure too, or the comment keeps the last green run's ✅
      - name: Comment PR with results
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_AVAILABLE: ${{ env.COVERAGE_AVAILABLE }}
          COVERAGE_LINES: ${{ env.COVERAGE_LINES }}
          COVERAGE_STATEMENTS: ${{ env.COVERAGE_STATEMENTS }}
          COVERAGE_FUNCTIONS: ${{ env.COVERAGE_FUNCTIONS }}
          COVERAGE_BRANCHES: ${{ env.COVERAGE_BRANCHES }}
        with:
          script: |
            // A step that never ran, because an earlier one failed, is skipped
            const icon = (outcome) => ({ success: '✅', skipped: '⏭️' })[outcome] ?? '❌';
            const lintStatus = icon('${{ steps.lint.outcome }}');
            const typecheckStatus = icon('${{ steps.typecheck.outcome }}');
            const testStatus = icon('${{ steps.test.outcome }}');

            // Coverage section
            let coverageSection = '';
            if (process.env.COVERAGE_AVAILABLE === 'true') {
              const lines = process.env.COVERAGE_LINES;
              const statements = process.env.COVERAGE_STATEMENTS;
              const functions = process.env.COVERAGE_FUNCTIONS;
              const branches = process.env.COVERAGE_BRANCHES;
              
              const getCoverageEmoji = (pct) => {
                const num = parseFloat(pct);
                if (num >= 90) return '🟢';
                if (num >= 80) return '🟡';
                if (num >= 70) return '🟠';
                return '🔴';
              };
              
              coverageSection = `
            ## 📊 Test Coverage

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Lines | ${lines}% | ${getCoverageEmoji(lines)} |
            | Statements | ${statements}% | ${getCoverageEmoji(statements)} |
            | Functions | ${functions}% | ${getCoverageEmoji(functions)} |
            | Branches | ${branches}% | ${getCoverageEmoji(branches)} |

            `;
            } else if ('${{ steps.test.outcome }}' === 'success') {
              coverageSection = `
            ## 📊 Test Coverage
            
            ⚠️ Coverage data not available
            
            `;
            }

            const hasFailures = '${{ job.status }}' !== 'success';

            const comment = `## 🔍 CI Results

            | Check | Status |
            |-------|--------|
            | Linting | ${lintStatus} |
            | Type-check | ${typecheckStatus} |
            | Tests | ${testStatus} |
            ${coverageSection}
            ${hasFailures ? '❌ Some checks failed. Please review the logs above.' : '✅ All checks passed!'}

            ---
            *Updated at ${new Date().toISOString()}*`;

            // Find existing CI comment and update it, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(comment => 
              comment.body.includes('🔍 CI Results') && 
              comment.user.type === 'Bot'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Browser tests run beside the unit tests, not after them, so the pipeline
  # takes as long as the slower of the two. They are split over two runners:
  # a runner's cores are saturated by two browsers already (four workers ran
  # no faster than two), so only another runner shortens the wait.
  e2e:
    name: E2E (Playwright + axe, ${{ matrix.shard }}/2)
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.release != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One shard failing still lets the other report its own failures
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm, the Node.js package.json pins (devEngines.runtime), then the
      # dependencies as the lockfile has them, from a cached store (saved by
      # the ci job, not here)
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      # Voice commands' speech model, 40 MB and not in git: fetched from
      # alphacephei.com once per model, checked against its pinned SHA-256
      # (apps/web/scripts/fetch-voice-model.mjs), and built into the site
      - name: Cache the speech model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/models
          key: voice-model-${{ hashFiles('apps/web/scripts/fetch-voice-model.mjs') }}

      - name: Fetch the speech model
        run: pnpm --filter @alltp/web fetch-voice-model

      # Uses the runner's preinstalled Google Chrome (playwright.config.ts),
      # so no browser is downloaded.
      - name: Run browser tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      # The production build the browser tests just served is the one that
      # ships: the deploy job publishes it without building again, from the
      # first shard (both build the same commit).
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/master' && matrix.shard == 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

  # Master only, once both test jobs pass: a pull request's ref is
  # refs/pull/…, so this never runs for one.
  deploy:
    name: Deploy to GitHub Pages
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
