name: CI

on:
  # "*" stops at a slash, so it never matched feat/… or dependabot/… branches:
  # run on every pull request, whatever its branch, and on master once merged.
  push:
    branches: [master]
    # No job reads Markdown: a docs-only change has nothing to test or deploy
    paths-ignore: &docs-only
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore: *docs-only
  # Run from the Actions tab on master to redeploy the site
  workflow_dispatch:
  # Every night, the full suite on master, if master moved since the last green
  # full run (plan): fresh property-test seeds and the runner's latest Chrome,
  # on trees master deployed without testing again (docs/ci.md).
  schedule:
    - cron: '17 3 * * *'

# A new push to a pull request makes its running checks obsolete: cancel them.
# Pushes to master always run to the end, so deployments never overlap. The
# nightly run deploys nothing: it has a group of its own and never holds a
# push back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The coverage comment on pull requests
  pull-requests: write

jobs:
  # What a push to master, or the nightly run, has to do (mode, docs/ci.md):
  #   skip     nothing to test or deploy: a release commit (version and
  #            changelog only; release-please still tags it), or a nightly run
  #            with master unchanged since its last green full run;
  #   promote  build and deploy only: a pull request of this repository
  #            already tested this exact tree;
  #   full     tests, then deploy.
  # Pull requests have no plan, and without one everything runs. If the plan
  # itself fails its mode is empty, and everything runs too.
  plan:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/plan.yml

  ci:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'skip' && needs.plan.outputs.mode != 'promote' }}
    runs-on: ubuntu-latest
    # `actions: read` lets the store check below list the repository's caches
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm store is saved by this job, on master, once per lockfile: every
      # other job in the repository only restores it (docs/ci.md, "Caches").
      # pnpm/setup would otherwise save a new copy (about 120 MB, under a key
      # unique to the run) at the end of every job, and the copies pushed the
      # Rust caches towards eviction. A pull request reads master's copy.
      # If the listing fails, `save` stays true: a spare copy beats none.
      - name: Is the pnpm store already cached for this lockfile?
        id: store
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
        run: |
          keys=$(gh cache list --ref refs/heads/master --key pnpm-cache-Linux --limit 100 \
            --json key --jq '.[].key') || keys=""
          if grep -q -- "-${LOCKFILE_HASH}-" <<< "$keys"; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "A store for this lockfile is cached already."
          else
            echo "save=true" >> "$GITHUB_OUTPUT"
            echo "No store for this lockfile yet: this job saves it."
          fi

      # pnpm, the Node.js package.json pins (devEngines.runtime), then the
      # dependencies as the lockfile has them, from a cached store
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: ${{ steps.store.outputs.save == 'true' }}
          require-lockfile: true

      - name: Run linter
        id: lint
        run: pnpm lint

      # Every workspace: the web app, its config files and e2e suite, the
      # engine and the game packs
      - name: Type-check
        id: typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        id: test
        run: pnpm test:coverage

      - name: Generate coverage summary
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage file found, processing..."
            # Extract coverage data using node
            node -e "
              const fs = require('fs');
              try {
                const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
                const total = coverage.total;
                console.log('COVERAGE_LINES=' + total.lines.pct);
                console.log('COVERAGE_STATEMENTS=' + total.statements.pct);
                console.log('COVERAGE_FUNCTIONS=' + total.functions.pct);
                console.log('COVERAGE_BRANCHES=' + total.branches.pct);
                console.log('COVERAGE_AVAILABLE=true');
              } catch (e) {
                console.log('COVERAGE_AVAILABLE=false');
                console.log('Error reading coverage:', e.message);
              }
            " >> $GITHUB_ENV
          else
            echo "COVERAGE_AVAILABLE=false" >> $GITHUB_ENV
            echo "Coverage file not found"
          fi

      # After a failure too, or the comment keeps the last green run's ✅
      - name: Comment PR with results
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_AVAILABLE: ${{ env.COVERAGE_AVAILABLE }}
          COVERAGE_LINES: ${{ env.COVERAGE_LINES }}
          COVERAGE_STATEMENTS: ${{ env.COVERAGE_STATEMENTS }}
          COVERAGE_FUNCTIONS: ${{ env.COVERAGE_FUNCTIONS }}
          COVERAGE_BRANCHES: ${{ env.COVERAGE_BRANCHES }}
        with:
          script: |
            // A step that never ran, because an earlier one failed, is skipped
            const icon = (outcome) => ({ success: '✅', skipped: '⏭️' })[outcome] ?? '❌';
            const lintStatus = icon('${{ steps.lint.outcome }}');
            const typecheckStatus = icon('${{ steps.typecheck.outcome }}');
            const testStatus = icon('${{ steps.test.outcome }}');

            // Coverage section
            let coverageSection = '';
            if (process.env.COVERAGE_AVAILABLE === 'true') {
              const lines = process.env.COVERAGE_LINES;
              const statements = process.env.COVERAGE_STATEMENTS;
              const functions = process.env.COVERAGE_FUNCTIONS;
              const branches = process.env.COVERAGE_BRANCHES;
              
              const getCoverageEmoji = (pct) => {
                const num = parseFloat(pct);
                if (num >= 90) return '🟢';
                if (num >= 80) return '🟡';
                if (num >= 70) return '🟠';
                return '🔴';
              };
              
              coverageSection = `
            ## 📊 Test Coverage

            | Metric | Coverage | Status |
            |--------|----------|--------|
            | Lines | ${lines}% | ${getCoverageEmoji(lines)} |
            | Statements | ${statements}% | ${getCoverageEmoji(statements)} |
            | Functions | ${functions}% | ${getCoverageEmoji(functions)} |
            | Branches | ${branches}% | ${getCoverageEmoji(branches)} |

            `;
            } else if ('${{ steps.test.outcome }}' === 'success') {
              coverageSection = `
            ## 📊 Test Coverage
            
            ⚠️ Coverage data not available
            
            `;
            }

            const hasFailures = '${{ job.status }}' !== 'success';

            const comment = `## 🔍 CI Results

            | Check | Status |
            |-------|--------|
            | Linting | ${lintStatus} |
            | Type-check | ${typecheckStatus} |
            | Tests | ${testStatus} |
            ${coverageSection}
            ${hasFailures ? '❌ Some checks failed. Please review the logs above.' : '✅ All checks passed!'}

            ---
            *Updated at ${new Date().toISOString()}*`;

            // Find existing CI comment and update it, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(comment => 
              comment.body.includes('🔍 CI Results') && 
              comment.user.type === 'Bot'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # Browser tests run beside the unit tests, not after them, so the pipeline
  # takes as long as the slower of the two. They are split over three runners:
  # a runner's cores are saturated by two browsers already (four workers ran
  # no faster than two), so only another runner shortens the wait. A fourth
  # would save about 35 s more and come close to the limit of 20 concurrent
  # jobs. The count lives in the matrix: everything else reads it from there.
  e2e:
    name: E2E (Playwright + axe, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'skip' && needs.plan.outputs.mode != 'promote' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One shard failing still lets the others report their own failures
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm, the Node.js package.json pins (devEngines.runtime), then the
      # dependencies as the lockfile has them, from a cached store (saved by
      # the ci job, not here)
      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      # Voice commands' speech model, 40 MB and not in git: fetched from
      # alphacephei.com once per model, checked against its pinned SHA-256
      # (apps/web/scripts/fetch-voice-model.mjs), and built into the site
      - name: Cache the speech model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/models
          key: voice-model-${{ hashFiles('apps/web/scripts/fetch-voice-model.mjs') }}

      - name: Fetch the speech model
        run: pnpm --filter @alltp/web fetch-voice-model

      # Uses the runner's preinstalled Google Chrome (playwright.config.ts),
      # so no browser is downloaded.
      - name: Run browser tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The production build the browser tests just served is the one that
      # ships: the deploy job publishes it without building again, from the
      # first shard (all build the same commit). The nightly run deploys nothing.
      - name: Upload the site for GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'schedule' && matrix.shard == 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/

      - name: Upload the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 7

  # Pull requests of this repository only, once every test job has passed:
  # records that this tree was tested, as the artifact `tested-<tree>`. Master
  # looks for it (plan, find-tested-tree.sh) and, if it trusts the run that
  # holds it, builds and deploys without testing again. The artifact is the
  # name and nothing else; what makes it trustworthy is the run it belongs to,
  # which master checks (docs/ci.md, "Promoting a tested tree"). A fork's pull
  # request records nothing, and master would not believe it.
  #
  # The tree is the one of the merge commit the jobs above tested
  # (refs/pull/N/merge, GITHUB_SHA). A rebase merge pushes that same tree when
  # master has not moved since; if it has, the tree differs and master tests.
  tested:
    name: Record the tested tree
    needs: [ci, e2e]
    # Not the implicit success(): a pull request has no plan, a skipped job
    # that ci and e2e wait for, and that would skip this one too
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.ci.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # A record is a shortcut for master, never a requirement: if this job fails
    # (an API hiccup), the pull request stays green and master simply tests.
    continue-on-error: true
    # Reads the commit through the API: no checkout, nothing of the pull
    # request is run here
    permissions:
      contents: read

    steps:
      - name: Find the tested tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected tree id: $tree" >&2; exit 1; }
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'tree %s\nmerge commit %s\nrun %s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/tested.txt"

      # A re-run of the workflow uploads again: overwrite, or it conflicts
      - name: Upload the record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Master, when plan found the tree tested already: the site the browser
  # tests exercised, built again from the same tree (the build is
  # reproducible), for the deploy job. Otherwise the e2e job uploads it.
  build:
    name: Build the site
    needs: plan
    if: needs.plan.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      # The same model, cache and check as the e2e job: it is built into the site
      - name: Cache the speech model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/models
          key: voice-model-${{ hashFiles('apps/web/scripts/fetch-voice-model.mjs') }}

      - name: Fetch the speech model
        run: pnpm --filter @alltp/web fetch-voice-model

      - name: Build the site
        run: pnpm --filter @alltp/web build

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/

  # Master only, never the nightly run, once the site is ready: tested by the
  # jobs above (full), or by a pull request (promote). A pull request's ref is
  # refs/pull/…, so this never runs for one.
  deploy:
    name: Deploy to GitHub Pages
    needs: [ci, e2e, build]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/master' && github.event_name != 'schedule'
      && (needs.build.result == 'success' || (needs.ci.result == 'success' && needs.e2e.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Releases follow the deploy, never precede it: a master that did not build,
  # test or deploy (a red run) cuts nothing. release-please keeps one pull
  # request open that bumps the version and writes the changelog from the commit
  # messages merged since the last release (release-please-config.json lists
  # which types are shown); merging that pull request tags the release and
  # publishes it on GitHub. It runs:
  #   - after a deploy, full or promoted, to bring that pull request up to date;
  #   - on a release commit, which plan skips: nothing is deployed, and the
  #     tag is what remains to do. plan only skips one whose parent was
  #     deployed already (is-release-commit.sh).
  # A release run replaced in the master queue by a newer one tags nothing; the
  # next run does, as release-please acts on every merged release pull request
  # still labelled `autorelease: pending`, if the guard below accepts its commit
  # (docs/ci.md, "Releases").
  # The workflow token opens the pull request, so no check runs on it.
  release-please:
    name: Release
    needs: [plan, deploy]
    if: >-
      ${{ !cancelled() && (needs.deploy.result == 'success'
      || (github.event_name == 'push' && needs.plan.outputs.mode == 'skip')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that writes to the repository: the release pull request and
    # its labels (issues), the tag and the release (contents)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      # The scripts and nothing else; the job's write token is not kept
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # release-please tags a merged release pull request at ITS merge commit,
      # whichever commit this run is on. A release that waited (a red master, a
      # replaced run) must not be tagged on a tree no run verified: refuse, and
      # let a person decide (release-guard.sh, docs/ci.md "Releases").
      - name: Refuse a release no run verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: bash .github/scripts/release-guard.sh

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Starts the build of the installers of a release that was just cut, as a run
  # of its own (desktop-release.yml): it does not hold the master queue for the
  # 4 to 8 minutes of the build, and a failed build does not turn master red. A
  # dispatch is the one event a job's GITHUB_TOKEN may start; the tag and the
  # release that token creates start nothing.
  desktop:
    name: Start the desktop installers
    needs: release-please
    # A status function: without one the condition gets an implicit success(),
    # which looks at every ancestor job and skips this one as soon as any of
    # them was skipped (`build` in a full run, `ci` in a promoted one, `deploy`
    # on a release commit: always one) -- actions/runner#491.
    if: >-
      ${{ !cancelled() && needs.release-please.result == 'success'
      && needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Lets the job start a workflow, and also cancel or re-run one: it holds no
    # other permission and runs the one command below
    permissions:
      actions: write
    steps:
      # `--ref master`: the workflow file that runs is master's own. By hand:
      # gh workflow run desktop-release.yml --ref master -f tag=vX.Y.Z
      - name: Start the build
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh workflow run desktop-release.yml --ref master -f tag="$TAG"

  # The nightly run found something: one open issue at most, which a later
  # failure comments on instead of opening another. Close it once fixed.
  # Anything but a success counts, a timeout or a cancelled shard included
  # (a stuck Chrome is what the nightly run is there to catch); a run that
  # plan skipped has nothing to report, and a cancelled workflow no report.
  nightly-report:
    name: Report a failed nightly run
    needs: [plan, ci, e2e]
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' && needs.plan.outputs.mode != 'skip'
      && (needs.ci.result != 'success' || needs.e2e.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write

    steps:
      - name: Open the issue, or comment on the open one
        env:
          CI_RESULT: ${{ needs.ci.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LABEL: nightly-ci
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: The nightly CI run failed on master
        run: |
          body=$(printf 'The nightly full run of `%s` did not pass: unit tests job `%s`, browser tests `%s`.\n\n%s\n\nIt runs when master moved since the last green full run (docs/ci.md). Close this issue once fixed.' \
            "$GITHUB_SHA" "$CI_RESULT" "$E2E_RESULT" "$RUN_URL")
          # The label first, and idempotently: an issue created with a label that
          # does not exist loses it silently, and the next night would not find
          # this one. The title is the second key, in case it is lost anyway.
          gh label create "$LABEL" --force --color d93f0b \
            --description 'The nightly CI run failed on master' \
            || echo "::warning::could not create the $LABEL label"
          # Pull requests are issues too, for this endpoint
          open=$(gh api "repos/$GH_REPO/issues?state=open&per_page=100" --jq \
            '[.[] | select(.pull_request | not)
              | select(.title == env.TITLE or any(.labels[]; .name == env.LABEL))][0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh api "repos/$GH_REPO/issues" -f title="$TITLE" -f body="$body" \
              -f "labels[]=$LABEL" --jq '.html_url'
          fi
