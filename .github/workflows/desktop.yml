name: Desktop

# The desktop app's Rust side (apps/desktop/src-tauri): lint, format and
# tests on Linux, and the lint again on Windows and macOS (their own code),
# on a pull request or a push that touches it only. Its web side is
# apps/web's, which the CI workflow tests; its installers are built for each
# OS when a release is cut (desktop-release.yml, started by ci.yml).
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri's system libraries on Linux: WebKitGTK and its kin
      - name: Install system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # The crates and their build artifacts, saved from master only
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # tauri::generate_context! embeds the pages: they must exist to compile
      - name: Build the app's pages
        working-directory: .
        run: pnpm --filter @alltp/web exec vite build --mode desktop

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # The code that compiles on one system only (cfg(windows), macOS) is linted
  # where it compiles: otherwise a mistake there fails the release matrix,
  # after the merge, instead of the pull request.
  platforms:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # tauri::generate_context! embeds the pages: they must exist to compile
      - name: Build the app's pages
        working-directory: .
        run: pnpm --filter @alltp/web exec vite build --mode desktop

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # The servers' bind and restart behave differently on Windows (an
      # exclusive bind waits for a closing connection: docs/desktop.md,
      # "Stream tools"): only their tests run here, the rest is Linux's
      - name: Test the servers
        if: matrix.os == 'windows-latest'
        run: "cargo test --locked -- stream:: relay::"
