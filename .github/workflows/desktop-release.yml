name: Desktop release

# The desktop app (apps/desktop), built for each OS once a release is cut: its
# installers, their updater signatures and the updater's latest.json are
# attached to the release, where the installed apps look for updates. Called by
# ci.yml, from the `desktop` job that follows release-please, and by nothing
# else (docs/ci.md, "Releases"). The release's own commit is built, the version
# read from package.json.
on:
  workflow_call:
    inputs:
      tag:
        description: "The release's tag (v1.2.3): the commit built, and the release the files are attached to"
        type: string
        required: true
    # Named one by one, never `secrets: inherit`: this workflow gets the updater's
    # signing key and nothing else of the repository's secrets.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: "The updater's key: installed apps refuse an update it did not sign"
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "The passphrase of that key"
        required: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon, and Intel cross-built on the same runner
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # The oldest glibc the AppImage should run on
          - os: ubuntu-22.04
            target: ""
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    # Attaches the files to the release. The calling job grants the same: a
    # called workflow cannot ask for more.
    permissions:
      contents: write
    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          key: ${{ matrix.target }}

      # The updater's key signs each installer: the installed apps refuse an
      # update it did not sign. It lives in the repository's secrets only.
      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
