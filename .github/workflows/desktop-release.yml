name: Desktop release

# The desktop app (apps/desktop), built for each OS for a release that exists:
# its installers, their updater signatures and the updater's latest.json are
# attached to that release, where the installed apps look for updates. The tag's
# own commit is built, the version read from package.json.
#
# Started by the `desktop` job of ci.yml once release-please cuts a release (a
# token-made dispatch is the one event that job may start), or by hand, to build
# the installers of a tag again:
#   gh workflow run desktop-release.yml --ref master -f tag=v1.2.3
# It runs apart from the master pipeline, so it neither holds the master queue
# nor turns master red (docs/ci.md, "Releases").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (v1.2.3): the commit built, and the release the files are attached to"
        type: string
        required: true

permissions:
  contents: read

# One build per tag at a time; a second one for the same tag waits, never cancels
concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Anyone with write access can dispatch this workflow from any branch, with
  # that branch's copy of it, and the signing key is a repository secret: the
  # copy that matters is master's. What is built must also be a release.
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the ref and the tag
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$REF" = refs/heads/master ] || fail "Run this workflow from master (--ref master), not from $REF."
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "The tag must look like v1.2.3."
          gh release view "$TAG" > /dev/null || fail "No release has the tag $TAG."
          # The tag is an ancestor of master: master is ahead of it, or at it
          status=$(gh api "repos/$GH_REPO/compare/$TAG...master" --jq .status) \
            || fail "Could not compare $TAG with master."
          case "$status" in
            ahead | identical) ;;
            *) fail "The tag $TAG is not on master (status: $status)." ;;
          esac

  # The job id stays `desktop`: Swatinem/rust-cache puts it in its cache keys
  # (v0-rust-desktop-<os>-...), and a new id would start from a cold cache
  desktop:
    name: Desktop (${{ matrix.os }}${{ matrix.target && format(', {0}', matrix.target) || '' }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon, and Intel cross-built on the same runner
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # The oldest glibc the AppImage should run on
          - os: ubuntu-22.04
            target: ""
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    # Attaches the files to the release
    permissions:
      contents: write
    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm, Node.js and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          key: ${{ matrix.target }}

      # The updater's key signs each installer: the installed apps refuse an
      # update it did not sign. It lives in the repository's secrets only.
      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # The four builds run at once: each writing latest.json, two writing
          # together lost one side's entries (v2.42.0 lost Linux). The job
          # below writes it once, after them all.
          uploadUpdaterJson: false

  # The updater's latest.json, from the installers and signatures the builds
  # attached. Not when a build failed: the installed apps would then be offered
  # an update with a platform missing, and rerunning the failed job runs this.
  updater:
    name: Write latest.json
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Write and attach latest.json
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: .github/scripts/updater-json.sh "$TAG"
