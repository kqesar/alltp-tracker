name: "CodeQL Advanced"

# The TypeScript. The workflows have their own analysis (codeql-actions.yml),
# which only runs when .github/ changes.
on:
  push:
    branches: [ "master" ]
    # Markdown holds no code to scan; the weekly run still covers everything
    paths-ignore: &docs-only
      - '**.md'
      - LICENSE
  pull_request:
    branches: [ "master" ]
    paths-ignore: *docs-only
  schedule:
    - cron: '21 13 * * 5'
  # Allow manually re-running the analysis from the Actions tab
  workflow_dispatch:

# A new push to a pull request makes its running analysis obsolete: cancel it.
# Every other run has a group of its own (the commit), so a push to master is
# never cancelled and no scan is dropped from the queue.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Public repository, no private query packs: uploading results is all
    # it needs beyond reading the code.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An interpreted language: CodeQL reads the sources, no build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"
