name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
    # Markdown holds no code to scan; the weekly run still covers everything
    paths-ignore: &docs-only
      - '**.md'
      - LICENSE
  pull_request:
    branches: [ "master" ]
    paths-ignore: *docs-only
  schedule:
    - cron: '21 13 * * 5'
  # Allow manually re-running the analysis from the Actions tab
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Public repository, no private query packs: uploading results is all
    # it needs beyond reading the code.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Both are interpreted languages: CodeQL reads the sources, no build.
        # `actions` covers the workflows in .github/workflows.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{matrix.language}}"
