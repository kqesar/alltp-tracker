name: Plan

# Decides, for a push to master or the nightly run, what the pipeline has to
# do: nothing (`skip`), only build and deploy a tree a pull request already
# tested (`promote`), or everything (`full`). It is called by the workflows
# that would otherwise run for nothing (CI, CodeQL), so the rule is written
# once. docs/ci.md says what it recognises and why.
on:
  workflow_call:
    inputs:
      deploys:
        description: "false for a caller that deploys nothing: it is never told to promote"
        type: boolean
        default: true
    outputs:
      mode:
        description: "'skip', 'promote' or 'full'"
        value: ${{ jobs.plan.outputs.mode }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The calling job grants the same: a called workflow cannot ask for more
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}

    steps:
      # The scripts and nothing else
      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Decide what to run
        id: plan
        env:
          AFTER: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          DEPLOYS: ${{ inputs.deploys }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/plan.sh
