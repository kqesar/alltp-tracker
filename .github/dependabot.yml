# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

# A multi-ecosystem group collapses npm, Docker and GitHub Actions into a
# single pull request instead of one per ecosystem. The group owns the
# schedule; each entry below only declares which ecosystem and which packages
# it contributes, and `patterns` is mandatory once an entry joins a group.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  # --------------------------------------------------------------------------
  # npm — runtime and dev dependencies
  # --------------------------------------------------------------------------
  # The prefix is spelled out on every entry so the shared commit message is
  # deterministic whichever ecosystem Dependabot attributes the PR to, and so
  # commitlint keeps accepting it (`build` is in the type-enum).
  - package-ecosystem: npm
    directory: '/'
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
    commit-message:
      prefix: 'build(deps)'

  # --------------------------------------------------------------------------
  # Base images
  # --------------------------------------------------------------------------
  # A major here needs a human: Dependabot has no idea which Node releases are
  # LTS, and this project is LTS-only. `node:25-alpine` is a valid bump and a
  # wrong one. Check the release line before merging.
  # Nothing to update yet — the repo has no Dockerfile — but the entry is kept
  # so image bumps join the group from the day one lands.
  - package-ecosystem: docker
    directory: '/'
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
    commit-message:
      prefix: 'build(deps)'

  # --------------------------------------------------------------------------
  # GitHub Actions
  # --------------------------------------------------------------------------
  # Actions are pinned by commit SHA against supply-chain tampering, which makes
  # them invisible to any manual "is this current?" check — the tag comment is
  # the only hint, and it lies as soon as it is stale. Dependabot rewrites both
  # the SHA and the comment, which is the only sustainable way to keep pinning.
  - package-ecosystem: github-actions
    directory: '/'
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
    commit-message:
      prefix: 'build(deps)'
