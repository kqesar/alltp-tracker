# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

# A multi-ecosystem group collapses npm and GitHub Actions into a
# single pull request instead of one per ecosystem. Everything that shapes that
# shared pull request — schedule, commit message — belongs to the group and is
# rejected on the individual entries; each entry only declares which ecosystem
# and which packages it contributes, and `patterns` is mandatory once an entry
# joins a group.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    # `build` is in the commitlint type-enum, and this is the prefix Dependabot
    # already picked by itself on the npm PRs.
    commit-message:
      prefix: 'build(deps)'

updates:
  # --------------------------------------------------------------------------
  # npm — runtime and dev dependencies
  # --------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: '/'
    multi-ecosystem-group: all-dependencies
    patterns: ['*']

  # A `docker` entry comes with the first Dockerfile, not before: with no image
  # to scan, its job failed every week from 2026-09 to 2026-10, and the group's
  # pull request never opened although the npm job found updates each time.
  # Once it lands, a major needs a human: Dependabot has no idea which Node
  # releases are LTS, and this project is LTS-only.

  # --------------------------------------------------------------------------
  # GitHub Actions
  # --------------------------------------------------------------------------
  # Actions are pinned by commit SHA against supply-chain tampering, which makes
  # them invisible to any manual "is this current?" check — the tag comment is
  # the only hint, and it lies as soon as it is stale. Dependabot rewrites both
  # the SHA and the comment, which is the only sustainable way to keep pinning.
  - package-ecosystem: github-actions
    directory: '/'
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
