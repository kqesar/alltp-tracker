[package]
name = "alltp-tracker"
# The app's version is the product's: tauri.conf.json reads the root package.json
version = "0.0.0"
description = "Rando Atlas, the desktop app"
license = "MIT"
repository = "https://github.com/kqesar/alltp-tracker"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "alltp_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# Live follow on the LAN (follow.rs): a small HTTP + WebSocket server on the
# tokio and hyper the app already runs
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
# The follow token, base64url: both already built for Tauri and its updater
base64 = "0.23.1"
getrandom = "0.4.3"
# The relay's own accept loop (follow.rs): HTTP/1 with a header timeout and a
# small read buffer, which axum::serve does not set. Both already under axum
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }
# The commands' arguments and replies, and the events the page listens to
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! writes the plugins' config as serde_json values
serde_json = { version = "1", features = ["raw_value"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
# Global shortcuts on Windows, macOS and X11 (global-hotkey under it)
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
# `alltp-tracker --step ...` reaches the running app instead of opening a second one
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.1"
# RetroArch's network commands: UDP, with a timeout (Tauri runs on tokio already)
tokio = { version = "1.54.0", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# A WebSocket client for follow.rs's tests: axum's own version, so it is built once
tokio-tungstenite = "0.29.0"

[target.'cfg(target_os = "linux")'.dependencies]
# The GlobalShortcuts portal (Wayland). async-io, as tauri-plugin-opener's zbus
# already runs: no second zbus runtime
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
# Deliberately not the latest major: it must be Tauri's own gtk-rs 0.18, since
# gdk-sys declares `links = "gdk-3"` and Cargo allows one copy of it
gdk = "0.18.2"
futures-util = { version = "0.3.34", default-features = false }

[target.'cfg(windows)'.dependencies]
# SO_EXCLUSIVEADDRUSE for the stream's listener (relay.rs, `bind_exclusive`):
# socket2, which tokio and hyper-util already build, makes the socket so the
# option can be set before the bind; windows-sys sets it (socket2 has no setter)
socket2 = "0.6.5"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_UI_Input_KeyboardAndMouse"] }
