<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- SEO Meta Tags -->
    <title>ALLTP Tracker - A Link to the Past Randomizer Item Tracker</title>
    <meta content="A modern web-based item and progress tracker for The Legend of Zelda: A Link to the Past randomizer speedruns and playthroughs. Track items, dungeons, chests, and boss rewards in real-time." name="description" />
    <meta content="kqesar" name="author" />
    <link href="https://kqesar.github.io/alltp-tracker/" rel="canonical" />

    <!-- Icons and installation: root-relative paths, which Vite prefixes with the base path -->
    <link href="/zelda-triforce.ico" rel="icon" type="image/x-icon" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <link href="/manifest.webmanifest" rel="manifest" />
    <!-- The page background, --color-bg in src/styles/variables.css -->
    <meta content="#07070b" name="theme-color" />
    <meta content="ALLTP Tracker" name="application-name" />

    <!-- Open Graph Meta Tags -->
    <meta content="ALLTP Tracker - A Link to the Past Randomizer Item Tracker" property="og:title" />
    <meta content="Modern web-based tracker for A Link to the Past randomizer. Track items, dungeons, chests, and boss rewards in real-time." property="og:description" />
    <meta content="website" property="og:type" />
    <meta content="https://kqesar.github.io/alltp-tracker/" property="og:url" />
    <meta content="https://kqesar.github.io/alltp-tracker/assets/map.png" property="og:image" />
    <meta content="ALLTP Tracker" property="og:site_name" />

    <!-- Twitter Card Meta Tags -->
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="ALLTP Tracker - A Link to the Past Randomizer Item Tracker" name="twitter:title" />
    <meta content="Modern web-based tracker for A Link to the Past randomizer. Track items, dungeons, chests, and boss rewards in real-time." name="twitter:description" />
    <meta content="https://kqesar.github.io/alltp-tracker/assets/map.png" name="twitter:image" />
  </head>

    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
