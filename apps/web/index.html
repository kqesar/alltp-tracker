<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- What search engines and link previews read. The page tracks one game, picked from storage, and sets its own title (src/main.tsx): a page per game for them is written at build time (seo/), the descriptions in seo/games.ts. -->
    <title>Rando Atlas · Randomizer Item Tracker</title>
    <meta content="Free item and map tracker for A Link to the Past, Super Metroid and SMZ3 randomizer runs: what you can reach, live, with autotracking. Works offline." name="description" />
    <meta content="kqesar" name="author" />
    <link href="https://kqesar.github.io/alltp-tracker/" rel="canonical" />

    <!-- Icons and installation: root-relative paths, which Vite prefixes with the base path -->
    <link href="/zelda-triforce.ico" rel="icon" type="image/x-icon" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <link href="/manifest.webmanifest" rel="manifest" />
    <!-- The page background, --color-bg in src/styles/variables.css -->
    <meta content="#07070b" name="theme-color" />
    <meta content="Rando Atlas" name="application-name" />

    <!-- Open Graph Meta Tags (the images are absolute: scrapers do not resolve a base path) -->
    <meta content="Rando Atlas · Randomizer Item Tracker" property="og:title" />
    <meta content="Free item and map tracker for A Link to the Past, Super Metroid and SMZ3 randomizer runs: what you can reach, live, with autotracking. Works offline." property="og:description" />
    <meta content="website" property="og:type" />
    <meta content="https://kqesar.github.io/alltp-tracker/" property="og:url" />
    <meta content="https://kqesar.github.io/alltp-tracker/social/alttpr.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="The Rando Atlas board for A Link to the Past" property="og:image:alt" />
    <meta content="Rando Atlas" property="og:site_name" />

    <!-- Twitter Card Meta Tags -->
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="Rando Atlas · Randomizer Item Tracker" name="twitter:title" />
    <meta content="Free item and map tracker for A Link to the Past, Super Metroid and SMZ3 randomizer runs: what you can reach, live, with autotracking. Works offline." name="twitter:description" />
    <meta content="https://kqesar.github.io/alltp-tracker/social/alttpr.png" name="twitter:image" />

    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","applicationCategory":"GameApplication","isAccessibleForFree":true,"name":"Rando Atlas","operatingSystem":"Web, Windows, macOS, Linux","url":"https://kqesar.github.io/alltp-tracker/"}</script>
  </head>
  <body>
    <!-- What a crawler or a browser without scripts reads. In <noscript>, so a browser that runs the page never paints it: the tracker mounts in its place, and a flash of text before the board is what a reload used to show -->
    <div id="root">
      <noscript>
        <main class="boot">
          <h1>Rando Atlas</h1>
          <p>Free item and map tracker for randomizer runs: what you can reach, live, with autotracking. It works offline once opened.</p>
          <ul>
            <li><a href="alttpr/">A Link to the Past</a></li>
            <li><a href="sm/">Super Metroid</a> (Map Rando)</li>
            <li><a href="smz3/">SMZ3</a> (samus.link)</li>
            <li><a href="archipelago/">Archipelago</a> (archipelago.gg, any game)</li>
          </ul>
        </main>
      </noscript>
    </div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
